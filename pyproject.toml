[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saemphysics"
version = "0.1.0"
description = "A verifiable exam-to-visual-explanation engine for physics"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "sympy>=1.12,<2",
]

[project.scripts]
saemphysics = "saemphysics.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
animation = [
    "manim>=0.19,<0.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
